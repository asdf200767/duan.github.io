<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>lab5演示</title>
    </head>
    <style>
        .border{
            width: 700px;
            height: 600px;
            text-align: center;
            position: absolute;
            left: 500px;
            top: 200px;
        }
        .box1{
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100px;
            border: 1px solid #0e0909;
        }
        .box1 ul{
            display: flex;
            position: absolute;
            top: 0;
            left: 200px;
        }
        .box1 li{
            margin-right: 50px;
        }
        .border{
            border: 1px solid #080808;
        }
        .box2{
            border: 1px solid #080808;
            width: 100%;
            height: 200px;
            position: absolute;
            top: 100px;
        }
        .word1{
            position: absolute;
            top: 60px;
            left: 250px;
        }
        .word2{
            position: absolute;
            left: 234px;
            top: 90px;
        }
        .word4{
            position: absolute;
            top: 30px;
            left: 234px;
        }
        .word3{
            height: 50px;
            width: 80%;
            position: absolute;
            top: 320px;
            left: 75px;
        }
        .but{
            background-color: rgb(236, 116, 140);
            position: absolute;
            width: 250px;
            height: 50px;
            top: 50px;
            left: 150px
        }
    </style>
    <body>
        <div class="border">
            <div class="box1">
                <ul>
                    <li><h1>密码登录</h1></li>
                    <li><h1>验证码</h1></li>
                </ul>
            </div>
            <div class="box2">
                <form action="" method="get" target="_blank">
                    <div class="word4">
                        <label for="word3">用户名：</label>
                        <input type="text" name="用户名" value="" id="用户名" placeholder="输入用户名" size="15" required>
                    </div>
            <div class="word1">
                <label for="word1">密码：</label>
                <input type="password" name="密码" value="" id="密码" placeholder="请输出密码" size="15" required>
            </div>
                <div class="word2">
                    <label for="word2">验证码：</label>
                    <input type="password" name="验证码" value="" id="密码" placeholder="请输入验证码" size="15" required>
               </div> 
            
            </div>
            <div class="word3">
             <a>登陆及同意 用户协议 隐私政策</a>
             <input type="submit" class="but" name="but" value="登录" required>          
            <select name="下拉">
                <option value="登录">登录</option>
                <option value="注册">注册</option>
            </select>
        </form>
        </div>
    </body>
</html>
