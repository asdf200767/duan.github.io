<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>lab5演示</title>
        <link rel="stylesheet" href="https://at.alicdn.com/t/c/font_5039821_yukexk92apd.css?spm=a313x.manage_type_myprojects.i1.9.6c4a3a81CdMXnC&file=font_5039821_yukexk92apd.css">
    </head>
    <style>
        .box{
            border: 1px solid #171212;
            width: 30%;
            height: 500px;
             margin-left: 40%;
            margin-top: 10%;
            box-shadow:  0 0 20px rgba(0, 0, 0, 0.3);
            background-color: #171212;
            opacity: 0.8;
            border-radius: 5%;
        }
        .tuxiang{
            display: flex;
            width: 100%;
            justify-content: center;
            gap: 20px;
        }
        .tuxiang img{
            width: 50px;
        }
        .tuxiang a{
            text-align: center;
        }
        .tuxiang a:not(:first-child){
            margin-left: 40px;
        }
         body{
            background-image: url(https://asdf200767.github.io/duan.github.io/背景.jpg);
            background-size: cover;
        }
        .box h3{
            text-align: center;
        }
        .text{
            width: 50%;
            margin-bottom: 20px;
            height: 30px;
        }
        .text1{
            width: 50%;
            height: 30px;
        }
        .fenge{
            text-align: center;
        }
        .but{
            margin-left: 40%;
            background-color: rgb(236, 193, 141);
            width: 20%;
            height: 30px;
            margin-bottom: 20px;
        }
        </style>
        </head>
        <body>
            <div class="box">
                <h3 style="color: aliceblue;"><span class="iconfont icon-shouji" style="color: rgb(220, 201, 28); font-size: larger; margin-right: 10px;"></span>图书购买登录系统</h3>
                <form action="https://asdf200767.github.io/duan.github.io/%E8%B4%AD%E4%B9%B0%E5%9B%BE%E4%B9%A6.html" method="get" target="_blank">
                    <label for="word1" style="color: rgb(32, 225, 225); margin-left: 35px;"><span class="iconfont icon-zhihangfankui" style="color: aliceblue;margin-right: 5px;"></span>邮箱：</label>
                        <input type="text" name="用户名" value="" id="邮箱" class="text" placeholder="输入你的邮箱" size="15" required>
                        <br>
                    <label for="word1" style="color: rgb(32, 225, 225); margin-left: 20px;"><span class="iconfont icon-mima" style="color: aliceblue ; margin-right: 5px;"></span>用户名：</label>
                        <input type="text" name="用户名" value="" id="用户名" class="text" placeholder="输入用户名" size="15" required>
                        <br>
                        <label for="word1" style="color: aqua; margin-left: 20px;"><span class="iconfont icon-yonghu" style="color: aliceblue; margin-right: 5px;"></span>填密码：</label>
                <input type="password" name="密码" value="" id="密码" class="text1" placeholder="请输出密码" size="15" required>
                <br>
                <div class="fenge">
                    <p style="color: aliceblue;">没有密码？请注册</p>
                </div>
                <input type="submit" class="but" name="but" value="登录" required>
                <br>
                <label for="word1" style="color: aliceblue; margin-left: 30px;">
                <input type="checkbox" name="是否记住" value="" id="已记住" required>记住我（7天内自动登录）</label>
                <h3 style="color: aliceblue; float: left;">问题:</h3>
<textarea name="留言" placeholder="如果登陆不了，请写下你的问题。" style="width: 300px; margin-left: 30px; height: 50px;"></textarea>
                </form>
</div>
