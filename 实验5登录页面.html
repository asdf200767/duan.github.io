<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>lab5演示</title>
        <link rel="stylesheet" href="">
    </head>
    <style>
        .box{
            border: 1px solid #171212;
            width: 30%;
            height: 350px;
             margin-left: 40%;
            margin-top: 10%;
            box-shadow:  0 0 20px rgba(0, 0, 0, 0.3);
            background-color: #171212;
            opacity: 0.8;
            border-radius: 5%;
        }
        .tuxiang{
            display: flex;
            width: 100%;
            justify-content: center;
            gap: 20px;
        }
        .tuxiang img{
            width: 50px;
        }
        .tuxiang a{
            text-align: center;
        }
        .tuxiang a:not(:first-child){
            margin-left: 40px;
        }
        body{
            background-image: url(../图片/背景.jpg);
            background-size: cover;
        }
        .box h3{
            text-align: center;
        }
        .text{
            width: 50%;
            text-align: center;
            margin-bottom: 20px;
            height: 30px;
        }
        .text1{
            width: 50%;
            height: 30px;
            text-align: center;
        }
        .fenge{
            text-align: center;
        }
        .but{
            margin-left: 40%;
            background-color: rgb(236, 193, 141);
            width: 20%;
            height: 30px;
            margin-bottom: 20px;
        }
        </style>
        </head>
        <body>
            <div class="box">
                <h3 style="color: aliceblue;">购买图书系统登陆处</h3>
                <form action="https://asdf200767.github.io/duan.github.io/%E8%B4%AD%E4%B9%B0%E5%9B%BE%E4%B9%A6.html" method="get" target="_blank">
                    <label for="word1" style="color: aqua; margin-left: 20px;">用户名：</label>
                        <input type="text" name="用户名" value="" id="用户名" class="text" placeholder="输入用户名" size="15" required>
                        <br>
                        <label for="word1" style="color: aqua; margin-left: 20px;">填密码：</label>
                <input type="password" name="密码" value="" id="密码" class="text1" placeholder="请输出密码" size="15" required>
                <br>
                <div class="fenge">
                    <p style="color: aliceblue;">没有密码？请注册</p>
                </div>
                <input type="submit" class="but" name="but" value="登录" required>
                </form>
        <div class="tuxiang">
    <a href="#"><img src="https://asdf200767.github.io/duan.github.io/微信.svg"></a>
    <a href="#"><img src="https://asdf200767.github.io/duan.github.io/支付宝.svg"><a>
    <a href="#"><img src="https://asdf200767.github.io/duan.github.io/谷歌.svg"></a>
</div>
</div>
    </body>
</html>
